<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerala Weather 🌴 Live Updates</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

    :root {
        --glass: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.25);
        --text: #ffffff;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f7938, #056608, #024d1f);
        background-attachment: fixed;
        color: var(--text);
        transition: background 1s ease;
        padding-bottom: 40px;
    }

    body.sunny { background: linear-gradient(135deg, #ff9a3d, #f76b1c, #d35400); }
    body.rainy { background: linear-gradient(135deg, #355c7d, #2c3e50, #1a2a3a); }
    body.cloudy { background: linear-gradient(135deg, #606c88, #3f4c6b, #2c3548); }
    body.night { background: linear-gradient(135deg, #141e30, #243b55, #0f1626); }
    body.storm { background: linear-gradient(135deg, #232526, #414345, #1a1a2e); }

    /* ---------- HEADER ---------- */
    header {
        text-align: center;
        padding: 30px 20px 10px;
        animation: fadeDown 0.8s ease;
    }

    header h1 {
        font-size: clamp(1.8rem, 5vw, 3rem);
        text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        letter-spacing: 1px;
    }

    header p {
        opacity: 0.85;
        margin-top: 6px;
        font-size: 1.05rem;
    }

    /* ---------- SEARCH / SELECT ---------- */
    .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 25px auto;
        padding: 0 20px;
    }

    select, .refresh-btn {
        padding: 13px 22px;
        border-radius: 50px;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        backdrop-filter: blur(12px);
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        outline: none;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    select option { color: #222; }

    select:hover, .refresh-btn:hover {
        background: rgba(255,255,255,0.28);
        transform: translateY(-2px);
    }

    .refresh-btn:active { transform: scale(0.95); }

    /* ---------- MAIN CARD ---------- */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    .main-card {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        border-radius: 28px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 15px 45px rgba(0,0,0,0.25);
        animation: fadeUp 0.8s ease;
    }

    .location-name {
        font-size: 1.6rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .weather-icon {
        font-size: 6rem;
        margin: 10px 0;
        animation: float 3s ease-in-out infinite;
        filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3));
    }

    .temperature {
        font-size: clamp(3.5rem, 10vw, 5.5rem);
        font-weight: 700;
        line-height: 1;
        text-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .condition { font-size: 1.4rem; margin-top: 8px; opacity: 0.95; }
    .feels-like { opacity: 0.8; margin-top: 6px; }

    /* ---------- DETAILS GRID ---------- */
    .details-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 30px;
    }

    .detail-box {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 18px;
        padding: 18px 12px;
        transition: transform 0.3s ease, background 0.3s ease;
    }

    .detail-box:hover { transform: translateY(-5px); background: rgba(255,255,255,0.2); }
    .detail-box .icon { font-size: 1.8rem; }
    .detail-box .label { font-size: 0.8rem; opacity: 0.75; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .detail-box .value { font-size: 1.25rem; font-weight: 600; margin-top: 4px; }

    /* ---------- SECTION TITLES ---------- */
    .section-title {
        margin: 40px 0 18px;
        font-size: 1.35rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* ---------- HOURLY FORECAST ---------- */
    .hourly-scroll {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding: 6px 2px 18px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.4) transparent;
    }

    .hourly-scroll::-webkit-scrollbar { height: 6px; }
    .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.35); border-radius: 10px; }

    .hour-card {
        flex: 0 0 auto;
        min-width: 95px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(10px);
        border-radius: 18px;
        padding: 16px 10
